name: Rushbet Bot 24/7

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Playwright, Stealth y dependencias
        run: |
          npm install playwright playwright-extra puppeteer-extra-plugin-stealth @supabase/supabase-js
          npx playwright install --with-deps chromium

      - name: Ejecutar Bot con Auto-Login
        env:
          RUSHBET_USER: ${{ secrets.RUSHBET_USER }}
          RUSHBET_PASSWORD: ${{ secrets.RUSHBET_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node bot_cloud.js

      - name: Guardar Captura en caso de error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: captura-error
          path: error.png
